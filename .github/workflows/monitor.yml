name: RestockRocket Monitor

on:
  schedule:
    # 每 5 分钟触发一次（GitHub Actions 的最小调度粒度就是 5 分钟，
    # 实际触发时间可能有几分钟的延迟，属于平台限制，无法避免）
    - cron: "*/5 * * * *"
  # 允许在 GitHub 网页上手动点击 "Run workflow" 立即测试一次
  workflow_dispatch: {}

# 允许 workflow 把抓到的数据提交回仓库
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取一次数据
        env:
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
          VARIANT_ID: ${{ vars.VARIANT_ID }}
        run: |
          python3 restock_rocket_monitor.py \
            --url "$PRODUCT_URL" \
            --variant-id "$VARIANT_ID" \
            --csv data/preorder_log.csv \
            --once

      - name: 提交数据变化（如果有）
        run: |
          git config user.name "restock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/preorder_log.csv
          git diff --cached --quiet || git commit -m "更新预售数据 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
